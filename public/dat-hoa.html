<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#26734f"><title>Đặt hoa · Tiệm hoa Quý Cảnh</title><link rel="stylesheet" href="/style.css?v=48"><style>
.public-page{max-width:560px;margin:auto;padding:18px 16px 80px}.public-head{text-align:center;padding:10px 0 20px}.public-head img{width:80px;height:80px;border-radius:20px}.public-head h1{font-size:1.45rem;margin:8px 0}.public-page .box{margin:12px 0}.public-page .box label{font-size:.96rem}.public-page .box label input,.public-page .box label textarea,.public-page .box label select{font-size:16px;min-height:48px}.public-note{padding:12px;background:#eaf4ed;border-radius:14px;color:#235d40;font-size:.92rem}.public-qr{display:block;width:min(80vw,290px);margin:16px auto;background:#fff;padding:10px;border-radius:15px}.public-amount{font-size:1.7rem;font-weight:800;text-align:center;color:#216a47}.public-row{display:flex;gap:8px}.public-row .btn{flex:1;font-size:.9rem}.public-page .hidden{display:none!important}#publicError{font-weight:600;color:#ba322b}.public-sum{font-weight:800;text-align:center;color:#276b4b;margin:12px}

.public-page .pfile{margin:.9rem 0}.public-page .pfile>span.lab{display:block;font-weight:600;font-size:.96rem;margin-bottom:6px}
.pfile .pick{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.pfile .btn{width:auto;min-height:48px;padding:0 18px}
.pfile input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#photoName{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.92rem}
#photoPrev{display:block;max-width:100%;max-height:220px;border-radius:14px;margin-top:10px;object-fit:cover}
.public-page input[type=date]:not(:focus):invalid::before{content:"Chọn ngày";color:var(--mut)}
.public-page input[type=time]:not(:focus):invalid::before{content:"Chọn giờ";color:var(--mut)}
</style></head><body><main class="public-page"><div class="public-head"><img src="/icon-192.png?v=3" alt="QC"><h1>Tiệm Hoa Quý Cảnh</h1><p class="muted">Gửi yêu cầu đặt hoa</p></div>
<div class="public-note">Vui lòng trao đổi mẫu hoa và giá với cửa hàng trước. Giá bạn nhập chỉ để tiệm tham khảo; tiệm sẽ xác nhận lại giá trước khi nhận làm.</div>
<form id="publicForm" class="box" enctype="multipart/form-data"><b>Thông tin đặt hoa</b>
<label>Họ tên khách hàng *<input name="customer" required maxlength="100" placeholder="Ví dụ: Chị Lan"></label>
<label>Số điện thoại *<input name="phone" required inputmode="tel" maxlength="18" placeholder="09xxxxxxxx"></label>
<label>Mẫu hoa và yêu cầu *<textarea name="content" rows="3" required maxlength="600" placeholder="Ví dụ: Bó hoa hồng pastel, gói giấy kem"></textarea></label>
<div class="pfile"><span class="lab">Ảnh mẫu hoa (không bắt buộc, tối đa 5 MB)</span><div class="pick"><button type="button" class="btn ghost" id="photoBtn">Chọn ảnh</button><span id="photoName" class="muted">Chưa chọn ảnh</span><button type="button" class="btn ghost hidden" id="photoClear">Bỏ ảnh</button></div><input type="file" accept="image/jpeg,image/png,image/webp" name="photo" id="photoInput" tabindex="-1" aria-label="Chọn ảnh mẫu hoa"><img id="photoPrev" class="hidden" alt="Ảnh mẫu hoa đã chọn"></div>
<label>Ngày nhận hoa *<input type="date" name="dueDate" required></label>
<label>Giờ nhận hoa *<input type="time" name="dueTime" required></label>
<label>Giá dự kiến đã trao đổi với tiệm (đồng) *<input type="text" name="total" required placeholder="500.000" inputmode="numeric" autocomplete="off" data-money></label>
<label>Hình thức nhận<select name="method" id="publicMethod"><option value="pickup">Khách đến lấy</option><option value="delivery">Cửa hàng giao hoa</option></select></label>
<label id="deliveryAddr" class="hidden">Địa chỉ giao hoa *<textarea name="address" rows="2" maxlength="250"></textarea></label>
<label>Ghi chú (không bắt buộc)<textarea name="note" rows="2" maxlength="500"></textarea></label>
<div id="turnstile" class="hidden"></div><p id="publicError" role="alert"></p><button class="btn primary" type="submit" id="publicSubmit">Gửi yêu cầu đặt hoa</button>
</form><div id="publicDone" class="hidden box" aria-live="polite"></div></main><script src="/dat-hoa.js?v=4"></script></body></html>
