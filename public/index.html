<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hoa Quý Cảnh">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon-64.png?v=qc4" type="image/png" sizes="64x64">
<link rel="icon" href="/favicon-192.png?v=qc4" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/icon-180.png?v=qc3">
<title>Quản lý đơn hàng · Tiệm Hoa Quý Cảnh</title>
<link rel="stylesheet" href="/style.css?v=48">
<link rel="stylesheet" href="/ui-v5.css?v=2">
</head>
<body>

<section id="login" class="login hidden">
  <img class="login-logo" src="/icon-512.png?v=qc3" alt="">
  <h1>Quản lý đơn hàng</h1>
  <p class="muted">Tiệm Hoa Quý Cảnh</p>
  <div class="group" style="margin-top:1.6rem">
    <label class="row"><span class="lab">Mã truy cập</span>
      <input id="pin" type="password" inputmode="text" autocomplete="current-password" placeholder="Nhập mã của bạn"></label>
  </div>
  <button id="loginBtn" class="btn primary">Vào sổ đơn hàng</button>
  <p id="loginErr" class="err" role="alert"></p>
</section>

<div id="app" class="hidden">
  <header class="app-top" aria-label="Đầu trang">
    <div class="top-brand"><img class="logo" src="/logo-qc.png?v=1" alt="Logo QC"><div class="titles"><strong id="topTitle">Quản lý đơn hàng</strong><small id="topSubtitle">Tiệm Hoa Quý Cảnh</small></div></div>
    <div class="top-actions">
      <button id="searchToggle" class="top-icon" type="button" aria-label="Tìm kiếm đơn hàng" title="Tìm kiếm"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button>
      <button id="bell" class="top-icon bell" type="button" aria-label="Lịch sử thông báo" title="Thông báo"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg><span id="bellN" class="badge hidden"></span></button>
      <button id="addBtn" class="top-icon add" type="button" data-act="newmanual" aria-label="Tạo đơn hàng" title="Tạo đơn hàng"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span class="add-l">Tạo đơn hàng</span></button>
    </div>
  </header>
  <div class="search-overlay hidden" id="homeSearch"><div class="searchbox"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg><input id="q" type="search" placeholder="Tìm tên khách, số điện thoại, loại hoa" autocomplete="off" enterkeyhint="search"><button type="button" id="closeSearch" aria-label="Đóng tìm kiếm">✕</button></div></div>
  <div id="banner"></div>
  <div id="pullRefresh" class="pull-refresh" aria-live="polite"><span class="pull-symbol">↓</span><span id="pullText">Kéo xuống để làm mới</span></div>

  <main>
    <section id="tab-orders">
      <div id="stats" class="stats"></div>
      <div class="qrow"><div id="quick" class="qchips" role="group" aria-label="Chọn nhanh"></div>
        <label class="sortsel"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg><select id="sortSel" aria-label="Sắp xếp"><option value="new">Mới nhất</option><option value="old">Cũ nhất</option></select><svg class="ic car" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></label></div>

            <div id="list"></div>
    </section>

    <section id="tab-customers" class="hidden">
      <h2 class="h2">Khách hàng</h2>
      <div class="searchbox">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
        <input id="cq" type="search" placeholder="Tìm theo tên hoặc số điện thoại" autocomplete="off" enterkeyhint="search">
      </div>
      <div id="clist"></div>
    </section>

    <section id="tab-settings" class="hidden">
      <h2 class="h2">Cài đặt</h2>
      <div id="settingsHome" class="settings-home"></div>
    </section>
    <section id="tab-report" class="hidden">
      <h2 class="h2">Báo cáo</h2>
      <div id="report"></div>
    </section>
  </main>
  <nav class="nav" style="--i:0" aria-label="Điều hướng chính">
    <div class="side-brand" aria-hidden="true"><img src="/logo-qc.png?v=1" alt=""><strong>Tiệm Hoa<br>Quý Cảnh</strong></div>
    <span class="pill" aria-hidden="true"></span>
    <button data-tab="orders" class="on">
      <svg class="ic ic-m" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><svg class="ic ic-d" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
      <span>Đơn hàng</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
    <button data-tab="customers">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>Khách hàng</span></button>
    <button class="nav-mic" data-act="newvoice" aria-label="Nói để ghi đơn mới">
      <span class="mic-disc"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3zM19 10v2a7 7 0 0 1-14 0v-2M12 19v4"/></svg></span>
      <span class="l-s">Ghi đơn</span><span class="l-d">Nói để ghi đơn</span></button>
    <button data-tab="report">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
      <span>Báo cáo</span></button>
    <button data-tab="settings">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      <span>Cài đặt</span></button>
  <img class="side-lily" src="/deco-lily.png?v=1" alt="" aria-hidden="true">
  </nav>
</div>

<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script src="/core.js?v=49"></script>
<script src="/app.js?v=49"></script>
</body>
</html>
